name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    # The toolchain image is the slow part of the job. Build it through
    # BuildKit with the Actions cache so the apt layer is restored on later
    # runs; the Dockerfile COPYs only test/matrix/packages.txt before that
    # layer, so source-only changes are cache hits. `load: true` puts the
    # image in the runner's local Docker daemon — nothing is pushed to a
    # registry.
    - uses: docker/setup-buildx-action@v3

    - name: Build toolchain container (cached)
      uses: docker/build-push-action@v6
      with:
        context: .
        file: test/matrix/Dockerfile
        tags: rvemu-matrix:ci
        load: true
        cache-from: type=gha,scope=rvemu-matrix
        cache-to: type=gha,mode=max,scope=rvemu-matrix

    # Every build/test step runs in that container with the workspace
    # bind-mounted, so bin/ and out/ land back on the host for upload-artifact.
    # The image is based on ubuntu:24.04, which has every cross gcc in the
    # shared list (including mips/mipsel); matrix.py still reports N/A for any
    # toolchain that is unavailable.
    - name: Build (emulator + guest binaries)
      run: |
        docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace rvemu-matrix:ci \
          make bin/riscv64i bin/htest.elf bin/rtest.bin bin/stest.bin bin/ttest.bin bin/net.bin

    # Mandatory gates (host build, native run).
    - name: Run mandatory test suite
      run: |
        docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace rvemu-matrix:ci \
          bash -c 'set -e
            ./bin/htest.elf
            ./bin/riscv64i bin/rtest.bin
            ./bin/riscv64i bin/stest.bin
            # Negative control: the ttest guest executes an illegal instruction,
            # so the emulator must trap it and exit NON-ZERO. A zero exit would
            # mean the core silently kept running — that is a bug, fail it.
            if ./bin/riscv64i bin/ttest.bin; then
              echo "::error::ttest — emulator ran past an illegal instruction"
              exit 1
            fi
            echo "OK: ttest illegal instruction trapped with non-zero exit"'

    # Best-effort: hermetic — test/net/net.py serves test/net/ on
    # 127.0.0.1:8931 in-process (no external network, no DNS) and runs the
    # emulator against it. Must not gate CI.
    - name: Run net guest (best effort)
      run: |
        if docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace rvemu-matrix:ci \
             python3 test/net/net.py ./bin/riscv64i bin/net.bin; then
          echo "net guest: PASS"
        else
          echo "::warning::net guest failed (best effort only; not gating CI)"
        fi

    # QEMU portability matrix: cross-compile the emulator host for every arch
    # and run the guests under qemu-user (ttest = negative control,
    # net = best-effort, both mirrored in test/matrix/matrix.py).
    # Exits non-zero only when a mandatory gate fails on a runnable arch.
    - name: QEMU cross-arch portability matrix
      run: |
        docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace rvemu-matrix:ci \
          python3 test/matrix/matrix.py

    - name: Upload logs
      uses: actions/upload-artifact@v4
      with:
        name: rvemu-logs
        path: out
        if-no-files-found: ignore
        retention-days: 30
