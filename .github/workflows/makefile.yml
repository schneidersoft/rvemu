name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    # Guest toolchain + the exact cross/gcc + qemu-user set the
    # portability matrix uses (test/matrix/Dockerfile).
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-riscv64-unknown-elf \
          binutils-mipsel-linux-gnu gcc-mipsel-linux-gnu \
          binutils-mips-linux-gnu gcc-mips-linux-gnu \
          gcc-arm-linux-gnueabi \
          gcc-aarch64-linux-gnu \
          gcc-powerpc64le-linux-gnu \
          gcc-powerpc64-linux-gnu \
          gcc-powerpc-linux-gnu \
          gcc-s390x-linux-gnu \
          gcc-riscv64-linux-gnu \
          qemu-user

    # Build the emulator and every guest binary without running anything.
    - name: Build (emulator + guest binaries)
      run: make bin/riscv64i bin/htest.elf bin/rtest.bin bin/stest.bin bin/net.bin

    # Mandatory gates (host build, native run).
    - name: Run mandatory test suite
      run: |
        ./bin/htest.elf
        ./bin/riscv64i bin/rtest.bin
        ./bin/riscv64i bin/stest.bin

    # Best-effort: network dependent (google.com:80); must not gate CI.
    - name: Run net guest (best effort)
      run: |
        if ./bin/riscv64i bin/net.bin; then
          echo "net guest: PASS"
        else
          echo "::warning::net guest failed (best effort only; not gating CI)"
        fi

    # QEMU portability matrix: cross-compile the emulator host for every arch
    # and run the mandatory guests under qemu-user (net stays best-effort).
    # Exits non-zero only when a mandatory gate fails on a runnable arch.
    - name: QEMU cross-arch portability matrix
      run: test/matrix/matrix.sh

    - name: Upload logs
      uses: actions/upload-artifact@v4
      with:
        name: rvemu-logs
        path: out
        if-no-files-found: ignore
